spring.application.name=backend-infra-ti

# Carga variables locales al iniciar desde la carpeta del backend.
spring.config.import=optional:file:./.env[.properties]

# Origen legado de los controladores y lista central de orígenes del front.
app.cors.origen-front=http://localhost:4200
app.cors.origenes-front=http://localhost:4200,http://127.0.0.1:4200,http://localhost:5173,http://127.0.0.1:5173

# Nunca exponer detalles internos en las respuestas HTTP de error.
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-message=never
server.error.include-binding-errors=never

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=public

app.etl.base-url=${ETL_BASE_URL:http://127.0.0.1:8001}
app.etl.api-key=${ETL_API_KEY:}
