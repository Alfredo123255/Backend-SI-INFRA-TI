spring.application.name=backend-infra-ti

# Origen del front permitido por CORS (usado en @CrossOrigin de los controllers)
app.cors.origen-front=http://localhost:4200

# Nunca exponer detalles internos en las respuestas HTTP de error.
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-message=never
server.error.include-binding-errors=never

spring.datasource.url=jdbc:postgresql://localhost:5432/infrasisbd
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=public
